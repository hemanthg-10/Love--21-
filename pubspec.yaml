name: love21_flutter
description: Love 21 Flutter application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/love21_couple_banner.png
    - assets/images/love21_logo.png
    - assets/images/love21_login_couple.png
    - assets/images/love21_sketch_reactions.png
    - assets/images/love21_sketch_reactions_transparent.png
    - assets/images/love21_global_background_40_transparent.png
